server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/filspay/current/public/web;
    index index.html;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 502 504 = @api_unavailable;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_intercept_errors on;
        error_page 502 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 300 always;
        return 503 '{"error":"service_unavailable","message":"Service is temporarily unavailable. Please try again later."}';
    }

    # Both SPAs use hashed /assets URLs; serve only a real compiled asset.
    location /assets/ {
        root /srv/filspay/current/public;
        try_files /web$uri /admin$uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(login|merchants|credits|settlement|adjustment-imports|webhooks|security)(/|$) {
        root /srv/filspay/current/public/admin;
        try_files $uri /admin-index.html;
    }

    location = /admin-index.html {
        internal;
        alias /srv/filspay/current/public/admin/index.html;
        add_header Cache-Control no-store;
    }

    location = /index.html {
        add_header Cache-Control no-store;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
