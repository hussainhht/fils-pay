# Local development: generate ops/.env.docker with node ops/setup-env.mjs,
# then docker compose -f ops/docker-compose.yml up --build.
# Seeding is an explicit one-off job; normal startup never resets data.
# Stop apps before `--profile seed run --rm seed`; restart only after success.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: filspay_dev_password
      POSTGRES_DB: filspay
    ports:
      - "127.0.0.1:${FILSPAY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "seed"]
    env_file: .env.docker
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
      ALLOW_DESTRUCTIVE_SEED: "${ALLOW_DESTRUCTIVE_SEED:-0}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["node", "--import", "tsx", "apps/api/src/index.ts"]
    env_file: .env.docker
    ports:
      - "127.0.0.1:${FILSPAY_API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
      FEATURE_REFUNDS: "true"
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
    depends_on: &app_dependencies
      migrate:
        condition: service_completed_successfully

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    command: ["./settlement", "daemon"]
    env_file: .env.docker
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    depends_on: *app_dependencies

  reporting:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["node", "--import", "tsx", "apps/reporting/src/index.ts", "worker"]
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    depends_on: *app_dependencies

volumes:
  filspay_pgdata:
